<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f5ec">
  <meta name="description" content="Chopline is an interactive food ordering and delivery design prototype.">
  <title>Chopline · Design showcase</title>
  <script>
    try {
      if (localStorage.getItem('chopline-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#171219';
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <script defer src="content.js"></script>
  <script defer src="controls.js"></script>
  <script defer src="customer.js"></script>
  <script defer src="operations.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="root"></div>
  <a id="state-review" href="states.html">Review UI states</a>
  <style>#state-review{position:fixed;z-index:30;bottom:12px;right:12px;background:var(--solid);color:var(--on-solid);padding:9px 14px;border-radius:999px;font-weight:750;font-size:13px}.embedded #state-review{display:none}</style>
</body>
</html>
